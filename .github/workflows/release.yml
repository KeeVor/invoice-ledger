name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Run release from the matching version tag' }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_DIR=release/v$version" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm exec -- install-electron
      - run: npm run python:setup
      - run: npm run build
      - run: npm test
      - run: npm run test:python
      - run: npm run test:updates:ui
      - run: npm run dist
      - name: Verify update metadata and checksums
        run: node scripts/verify-release.mjs
      - name: Publish complete release
        shell: pwsh
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite a public release' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "票迹 $env:RELEASE_TAG" --notes-file docs/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release' }
          }
          $assets = @(Get-ChildItem "$env:RELEASE_DIR/Piaoji-Setup-*.exe", "$env:RELEASE_DIR/Piaoji-Setup-*.exe.blockmap", "$env:RELEASE_DIR/latest.yml", "$env:RELEASE_DIR/SHA256SUMS.txt" | ForEach-Object FullName)
          if ($assets.Count -ne 4) { throw 'Release assets incomplete' }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release' }
